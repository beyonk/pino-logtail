name: publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

env:
  NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up node and pnpm
        run: |
          corepack enable
          pnpm i

      - name: test
        run: pnpm test

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up node and pnpm
        run: |
          corepack enable
          pnpm config set '//registry.npmjs.org/:_authToken' "${NODE_AUTH_TOKEN}"
          pnpm config set '//npm.pkg.github.com/:_authToken' "${{ secrets.GITHUB_TOKEN }}"
          pnpm i

      - name: publish
        run: |
          pnpm publish --registry https://npm.pkg.github.com --no-git-checks
          pnpm publish --registry https://registry.npmjs.org --no-git-checks --access public